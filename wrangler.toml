name = "student-management-cloudflare"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Log/exception của Worker hiện trong Cloudflare Dashboard (Workers Logs).
[observability]
enabled = true

# Đặt Worker gần database (Supabase) thay vì gần người dùng: mỗi request có
# nhiều round trip Worker -> PostgREST hơn là tới browser.
[placement]
mode = "smart"

[vars]
DATA_SOURCE = "supabase"
NEXT_PUBLIC_APP_ENV = "production"
NEXT_PUBLIC_ENABLE_DEV_ROLE_SWITCHER = "false"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12Y3dkcXptdmdqZHdxbm54YXhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4Mjk4MTcsImV4cCI6MjEwNTQwNTgxN30.ofWMziipowuH3TtFSvkSloHrpeoXyobJpztMPccrMck"
NEXT_PUBLIC_SUPABASE_URL = "https://mvcwdqzmvgjdwqnnxaxb.supabase.co"
SUPABASE_URL = "https://mvcwdqzmvgjdwqnnxaxb.supabase.co"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# KV dùng chung cho 2 việc:
#  - đếm số lần đăng nhập sai (rate limit login) — nếu thiếu binding, bộ đếm rơi
#    về bộ nhớ từng isolate nên kẻ dò mật khẩu có thể "né" bằng cách rơi vào
#    isolate khác;
#  - version key của cache tham chiếu (phối hợp giữa các colo).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4c6448c8a9c44b0e88d569c08ef29ddd"

# Các secret cấp production KHÔNG đặt ở đây, nạp bằng `wrangler secret put <TÊN>`
# (hoặc .dev.vars khi chạy local). Không commit khóa vào repo công khai:
#   SUPABASE_SERVICE_ROLE_KEY  — khoá service_role của Supabase
#   SESSION_SECRET             — ký cookie phiên (>= 32 ký tự)
